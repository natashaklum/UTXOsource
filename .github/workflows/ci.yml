name: CI
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy utxoproof/ scripts/

      - name: Test
        run: pytest

  regtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Start regtest bitcoind
        run: |
          for i in 1 2 3 4 5; do
            docker pull lncm/bitcoind:v25.1 && break
            echo "image pull attempt $i failed, retrying..."
            sleep $((i * 15))
          done
          docker image inspect lncm/bitcoind:v25.1
          docker run -d --name bitcoind -p 18443:18443 lncm/bitcoind:v25.1 \
            -regtest=1 -server=1 -rpcuser=utxoproof -rpcpassword=utxoproof-test \
            -rpcallowip=0.0.0.0/0 -rpcbind=0.0.0.0 -fallbackfee=0.0002
          for i in $(seq 1 30); do
            curl -sf -u utxoproof:utxoproof-test \
              --data '{"jsonrpc":"1.0","method":"getblockcount","params":[]}' \
              http://127.0.0.1:18443/ && break
            sleep 2
          done

      - name: Regtest end-to-end
        run: pytest -m regtest -p no:cacheprovider --no-cov

  debian-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (documented hashed flow, docs/USAGE.md)
        run: |
          python -m venv .venv
          .venv/bin/pip install "rp2 @ git+https://github.com/natashaklum/rp2.git@b1995bf1a07665035a46cf331cb06ccccd347ce2"
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
          .venv/bin/pip install -e . --no-deps

      - name: Test via native venv
        run: .venv/bin/python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Pull base image
        run: |
          for i in 1 2 3 4 5; do
            docker pull python:3.11-slim && break
            echo "image pull attempt $i failed, retrying..."
            sleep $((i * 15))
          done

      - name: Build image
        run: docker build -t utxoproof .

      - name: Smoke test
        run: docker run --rm utxoproof --version

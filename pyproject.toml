[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utxoproof"
version = "0.1.0"
description = "Bitcoin wealth management and compliance tool for Belgian self-custodians"
requires-python = ">=3.11"
dependencies = [
    # Sprint 0: rp2 only. Exchange plugins (DaLI) arrive in Sprint 1/8 and
    # need a C toolchain (backports-datetime-fromisoformat); re-add
    # "dali-rp2" then. Same for python-bitcoinrpc (Sprint 3).
    "rp2 @ git+https://github.com/natashaklum/rp2.git@main",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
utxoproof = "utxoproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["utxoproof"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "C4",
    "DTZ",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utxoproof --cov-report=term-missing"
